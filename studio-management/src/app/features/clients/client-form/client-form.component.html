<form [formGroup]="form" class="client-form" (ngSubmit)="onSubmit()">
  <!-- Photo. Uploaded after the client is saved, so a new client works too. -->
  <div class="client-photo">
    <app-avatar class="client-photo__preview" [photo]="photoUrl()" [name]="form.controls.name.value" />
    <div class="client-photo__actions">
      <label class="client-photo__pick">
        <input type="file" accept="image/*" (change)="onPhotoPicked($event)" hidden />
        <span>{{ hasPhoto() ? 'Change photo' : 'Add photo' }}</span>
      </label>
      @if (hasPhoto()) {
        <app-button type="button" variant="ghost" size="sm" (clicked)="removePhoto()">Remove</app-button>
      }
      <small class="client-photo__hint">JPG, PNG or WebP up to 5 MB.</small>
    </div>
  </div>

  <div class="client-form__row">
    <app-form-field
      label="Full Name"
      [control]="form.controls.name"
      placeholder="e.g. Priya Shah"
      [required]="true"
    />
    <app-form-field
      label="Sort Name"
      [control]="form.controls.sortName"
      placeholder="e.g. Priya"
      [required]="true"
    />
  </div>

  <div class="client-form__row">
    <app-form-field
      label="Company"
      [control]="form.controls.company"
      placeholder="e.g. Nova Textiles"
    />
    <app-form-field
      label="Email"
      type="email"
      [control]="form.controls.email"
      placeholder="contact@company.com"
    />
  </div>

  <div class="client-form__row">
    <app-form-field
      label="Phone"
      [control]="form.controls.phone"
      placeholder="+1 (555) 000-0000"
      [required]="true"
      [errorMessages]="{ pattern: 'Enter a valid phone number.' }"
    />
    <app-form-field
      label="Mobile Number"
      [control]="form.controls.mobileNumber"
      placeholder="9876543210"
      [required]="true"
      [errorMessages]="{ pattern: 'Mobile number must be 10 digits.' }"
    />
  </div>

  <div class="client-form__row">
    <app-form-field
      label="Status"
      type="select"
      [control]="form.controls.status"
      [options]="statusOptions"
      [required]="true"
    />
    <app-form-field
      label="Active"
      type="select"
      [control]="form.controls.isActive"
      [options]="[{ value: 'true', label: 'Yes' }, { value: 'false', label: 'No' }]"
    />
  </div>
</form>
