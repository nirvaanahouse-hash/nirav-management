 @if (service.pending(); as req) {
      <app-modal title="" [maxWidth]="420" (close)="service.resolve(false)">
        <div class="confirm">
          <span class="confirm__icon" [class.confirm__icon--danger]="req.danger">
            @if (req.danger) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            }
          </span>
          <h3 class="confirm__title">{{ req.title }}</h3>
          <p class="confirm__message">{{ req.message }}</p>
        </div>
        <div modal-footer>
          <app-button variant="secondary" (click)="service.resolve(false)">
            {{ req.cancelLabel || 'Cancel' }}
          </app-button>
          <app-button [variant]="req.danger ? 'danger' : 'primary'" (click)="service.resolve(true)">
            {{ req.confirmLabel || 'Confirm' }}
          </app-button>
        </div>
      </app-modal>
    }
