
  <div class="app-modal-backdrop" (click)="onBackdropClick()">
      <div
        class="app-modal"
        [style.maxWidth.px]="maxWidth()"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="title()"
        (click)="$event.stopPropagation()"
      >
        <header class="app-modal__header" [class.app-modal__header--bare]="!title()">
          @if (title()) {
            <h3>{{ title() }}</h3>
          }
          <button class="app-modal__close" (click)="close.emit()" aria-label="Close dialog">×</button>
        </header>
        <div class="app-modal__body"><ng-content /></div>
        @if (hasFooter()) {
          <footer class="app-modal__footer"><ng-content select="[modal-footer]" /></footer>
        }
      </div>
    </div>
