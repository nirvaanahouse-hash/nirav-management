<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <a class="sidebar__brand" [routerLink]="dashboardPath()">
    <span class="sidebar__mark">NH</span>
    @if (!collapsed()) { <span class="sidebar__brand-text">Nirvaana House</span> }
  </a>

  <nav class="sidebar__nav">
    @for (item of items(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
      >
        <span class="sidebar__rail"></span>
        <span class="sidebar__icon">
          <app-nav-icon [name]="item.icon" />
        </span>
        @if (!collapsed()) { <span class="sidebar__label">{{ item.label }}</span> }
      </a>
    }
  </nav>

  <button class="sidebar__collapse-btn" type="button" (click)="toggleCollapsed()">
    <svg
      viewBox="0 0 20 20"
      width="16"
      height="16"
      fill="none"
      [style.transform]="collapsed() ? 'rotate(180deg)' : 'none'"
    >
      <path d="M12.5 4L7 10l5.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @if (!collapsed()) { <span>Collapse</span> }
  </button>
</aside>
