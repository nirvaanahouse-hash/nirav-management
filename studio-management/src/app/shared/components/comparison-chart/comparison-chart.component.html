<div class="cmp">
  <div class="cmp__legend">
    <span class="cmp__key cmp__key--a">
      <i></i>{{ seriesA().label }}
      <b>{{ fmt(totalA(), seriesA().kind) }}</b>
    </span>
    <span class="cmp__key cmp__key--b">
      <i></i>{{ seriesB().label }}
      <b>{{ fmt(totalB(), seriesB().kind) }}</b>
    </span>
  </div>

  <div class="cmp__plot">
    <svg
      #svg
      class="cmp__svg"
      [attr.viewBox]="vb"
      preserveAspectRatio="none"
      (mousemove)="onMove($event)"
      (mouseleave)="clearHover()"
    >
      <line
        class="cmp__axis"
        [attr.x1]="plot.x0"
        [attr.x2]="plot.x1"
        [attr.y1]="midY"
        [attr.y2]="midY"
      />

      <g class="cmp__bars" [class.cmp__bars--in]="entered()">
        @for (bar of bars(); track bar.i) {
          <rect
            class="cmp__bar cmp__bar--a"
            [class.cmp__bar--hot]="hoverIndex() === bar.i"
            [attr.x]="bar.x"
            [attr.y]="bar.aY"
            [attr.width]="bar.w"
            [attr.height]="bar.aH"
            rx="3"
          />
          <rect
            class="cmp__bar cmp__bar--b"
            [class.cmp__bar--hot]="hoverIndex() === bar.i"
            [attr.x]="bar.x"
            [attr.y]="bar.bY"
            [attr.width]="bar.w"
            [attr.height]="bar.bH"
            rx="3"
          />
        }
      </g>

      @if (hovered(); as h) {
        <line class="cmp__guide" [attr.x1]="h.cx" [attr.x2]="h.cx" [attr.y1]="plot.yTop" [attr.y2]="plot.yBot" />
      }

      @for (lbl of xLabels(); track lbl.i) {
        <text class="cmp__xlabel" [attr.x]="lbl.cx" [attr.y]="plot.yBot + 16" text-anchor="middle">
          {{ lbl.label }}
        </text>
      }
    </svg>

    @if (hovered(); as h) {
      <div class="cmp__tip" [style.left]="tooltipLeft(h.cx)">
        <span class="cmp__tip-l">{{ h.label }}</span>
        <span class="cmp__tip-row cmp__tip-row--a">{{ seriesA().label }}: <b>{{ fmt(h.va, seriesA().kind) }}</b></span>
        <span class="cmp__tip-row cmp__tip-row--b">{{ seriesB().label }}: <b>{{ fmt(h.vb, seriesB().kind) }}</b></span>
        <span class="cmp__tip-delta">A vs B {{ deltaLabel() }}</span>
      </div>
    }
  </div>
</div>
