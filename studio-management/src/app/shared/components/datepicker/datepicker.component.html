<button
  #trigger
  type="button"
  class="dp__trigger"
  [class.dp__trigger--open]="isOpen()"
  [class.dp__trigger--invalid]="invalid()"
  [class.dp__trigger--placeholder]="!hasValue()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="dialog"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span class="dp__value">{{ triggerText() }}</span>
  <svg class="dp__icon" viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
    <rect x="2.5" y="4" width="15" height="13.5" rx="2.5" stroke="currentColor" stroke-width="1.5" />
    <path d="M2.5 8h15M6.5 2.5v3M13.5 2.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </svg>
</button>

@if (isOpen()) {
  <div class="dp__scrim" [appPopover]="trigger" [positioned]="false" (click)="close()"></div>

  <div class="dp__panel" [appPopover]="trigger" role="dialog" aria-modal="false" [attr.aria-label]="monthLabel()">
    <span class="dp__grabber" aria-hidden="true"></span>

    <div class="dp__head">
      <button type="button" class="dp__nav" aria-label="Previous month" (click)="shiftMonth(-1)">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
          <path d="M12 4L7 10l5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <strong class="dp__month">{{ monthLabel() }}</strong>
      <button type="button" class="dp__nav" aria-label="Next month" (click)="shiftMonth(1)">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
          <path d="M8 4l5 6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="dp__weekdays" aria-hidden="true">
      @for (d of weekdays; track d) { <span>{{ d }}</span> }
    </div>

    <div class="dp__grid">
      @for (week of weeks(); track $index) {
        @for (cell of week; track cell.iso) {
          <button
            type="button"
            class="dp__day"
            [class.dp__day--muted]="!cell.inMonth"
            [class.dp__day--today]="cell.isToday"
            [class.dp__day--selected]="isSelected(cell.iso)"
            [disabled]="cell.disabled"
            [attr.aria-current]="cell.isToday ? 'date' : null"
            [attr.aria-pressed]="isSelected(cell.iso)"
            (click)="pick(cell)"
          >
            {{ cell.day }}
          </button>
        }
      }
    </div>

    <div class="dp__foot">
      <button type="button" class="dp__link" (click)="clear()">Clear</button>
      <button type="button" class="dp__today" (click)="today()">Today</button>
    </div>
  </div>
}
