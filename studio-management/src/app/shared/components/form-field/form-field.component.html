 <label class="app-field">
      <span class="app-field__label">
        {{ label() }}
        @if (required()) { <span class="app-field__required">*</span> }
      </span>

      @switch (type()) {
        @case ('textarea') {
          <textarea
            class="app-field__control"
            [class.app-field__control--invalid]="showError()"
            [formControl]="control()"
            [placeholder]="placeholder()"
            rows="3"
          ></textarea>
        }
        @case ('select') {
          <select
            class="app-field__control"
            [class.app-field__control--invalid]="showError()"
            [formControl]="control()"
          >
            <option value="" disabled>{{ placeholder() || 'Select...' }}</option>
            @for (opt of options(); track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        }
        @default {
          <input
            class="app-field__control"
            [class.app-field__control--invalid]="showError()"
            [type]="type()"
            [formControl]="control()"
            [placeholder]="placeholder()"
            [readonly]="readonly()"
          />
        }
      }

      @if (showError()) {
        <span class="app-field__error">{{ errorMessage() }}</span>
      } @else if (hint()) {
        <span class="app-field__hint">{{ hint() }}</span>
      }
    </label>
