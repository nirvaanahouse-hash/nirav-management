<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Studio Management System</title>
  <base href="/" />
  <!-- viewport-fit=cover lets the app paint under the status bar / home indicator;
       the shell adds the safe-area padding back where it matters.
       interactive-widget=resizes-content shrinks the layout viewport when the
       on-screen keyboard opens, so a dialog's Save/Cancel row stays above it
       instead of sitting behind the keyboard. -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <app-root></app-root>
</body>
</html>
